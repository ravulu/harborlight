<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Fairwater</title>

  <!--
    The mark on its tile rather than on nothing.

    A favicon sits on browser chrome the page does not control, and that chrome
    is light in one theme and near black in the other. Two thin strokes on a
    transparent ground vanish against one of them. The filled circle carries its
    own contrast, and it is what the header shows anyway, so a tab reads as the
    same object as the page it belongs to.

    Colours are baked rather than inherited. currentColor has nothing to inherit
    from in a file loaded as an icon and would resolve to black. #006943 is the
    primary token and #f6fcf8 its foreground, both from the light theme, which
    read correctly on light and dark chrome alike.
  -->
  <circle cx="16" cy="16" r="16" fill="#006943" />

  <!-- The 16 unit mark, scaled 1.25x and centred: 16 * 1.25 = 20, offset 6. -->
  <g transform="translate(6 6) scale(1.25)"
     fill="none" stroke="#f6fcf8" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3 C5 5.5 5 10.5 2 13" />
    <path d="M14 3 C11 5.5 11 10.5 14 13" />
  </g>
</svg>
